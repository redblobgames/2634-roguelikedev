<!DOCTYPE html>
<html>
  <head>
    <title>2026 RoguelikeDev summer project</title>
    <script type="module" src="index.js"></script>
    <style>
        body { font-family: sans-serif; }
        * { box-sizing: border-box;}

        #game-container {
            display: grid;
            grid-template-columns: min-content;
            grid-template-areas: "game" "status-bar" "message-area";
        }

        #game {
            grid-area: game;
            z-index: 1;
            canvas {
                display: block;
                opacity: 0.5;
                &:focus {
                    outline: none;
                    opacity: 1.0;
                }
            }
        }

        #focus-reminder {
            grid-area: status-bar;
            text-align: center; /* horizontal */
            align-self: center; /* vertical */
            background: hsl(60 100% 75%);
            padding-block: 0.25em;
            color: black;
            opacity: 0.0;
            transition: all 0.2s;
            &.visible {
                opacity: 1.0;
            }
        }

        #health-bar-bg {
            grid-area: status-bar;
            background: hsl(0 50% 20%);
        }
        #health-bar-fg {
            grid-area: status-bar;
            background: hsl(200 50% 40%);
        }
        #health-bar-text {
            grid-area: status-bar;
            font-size: 0.8em;
            color: white;
            text-align: center; /* horizontal */
            align-self: center; /* vertical */
        }

        #messages {
            grid-area: message-area;
            width: 100%;
            height: 8em;
            font-family: var(--monospace), monospace;
            font-size: 0.8em;
            line-height: 1.0;
        }
        #messages {
            padding: 0.5em 1em;
            background: hsl(60 10% 10%);
            color: white;
            overflow-x: hidden;
            overflow-y: scroll;
            > div {
                margin-left: 1em;
                margin-bottom: 0.25em;
                text-indent: -1em;
            }
        }

        #world-entities {
            max-width: 100%;
            overflow-x: auto;
            font-family: monospace;
            th {
                background: #eee;
            }
            td:first-child {
                font-weight: bold;
            }
            td {
                padding: 4px;
            }
        }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="game-container">
        <div id="game"></div>
        <div id="health-bar-bg"></div>
        <div id="health-bar-fg"></div>
        <div id="health-bar-text"></div>
        <div id="focus-reminder">Click game for keyboard focus</div>
      </div>
      </div>
      <div id="messages"></div>
      <div id="world-entities"></div>
    </div>
  </body>
</html>
