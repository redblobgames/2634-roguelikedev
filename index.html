<!DOCTYPE html>
<html>
  <head>
    <title>2026 RoguelikeDev summer project</title>
    <script type="module" src="index.js"></script>
    <style>
        body { font-family: sans-serif; }
        * { box-sizing: border-box;}

        #game-container {
            display: grid;
            grid-template-columns: min-content;
            grid-template-areas: "game" "status-bar" "instructions" "message-area";
        }

        #game {
            grid-area: game;
            z-index: 1;
            canvas {
                display: block;
                opacity: 0.5;
                &:focus {
                    outline: none;
                    opacity: 1.0;
                }
            }
        }

        .overlay {
            grid-area: game;
            z-index: 0;
            height: auto;
            align-self: center;
            padding: 0.5em;
            line-height: 1.0;
            font-family: monospace;
            font-size: 0.8em;
            opacity: 0;

            &.visible {
                z-index: 2;
                pointer-events: none;
                box-shadow: 0 1px 4px -3px white;
                opacity: 1;
            }
            ul {
                column-count: 2;
                column-gap: 1em;
                column-fill: balance;
                li {
                    list-style-type: none;
                }
            }
            kbd {
                display: inline-block;
                border: 1px solid hsla(0, 0%, 0%, 0.5);
                padding: 2px 4px;
                font-weight: normal;
            }
        }
        #inventory-use {
            background: hsl(200, 10%, 20%);
            color: white;
            kbd {
                background: hsl(150, 50%, 30%);
                color: cyan;
            }
        }
        #inventory-drop {
            background: hsl(0, 20%, 20%);
            color: white;
            kbd {
                background: hsl(60, 50%, 30%);
                color: yellow;
            }
        }

        #instructions {
            grid-area: instructions;
            background: hsl(60 10% 10%);
            color: white;
            min-height: 1.5em;

            > * {
                display: none;
                font-size: 0.8em;
                text-align: center;
                padding-block: 0.25em;
                transition: all 0.2s;
                opacity: 0.0;
            }

            > *.visible {
                display: block;
                opacity: 1.0;
                background: hsl(150 20% 20%);
                color: white;
            }

            #focus-reminder {
                background: hsl(60 100% 75%);
                color: black;
            }
        }

        #health-bar-bg {
            grid-area: status-bar;
            background: hsl(0 50% 20%);
            height: 1.5em;
        }
        #health-bar-fg {
            grid-area: status-bar;
            background: hsl(200 50% 40%);
        }
        #health-bar-text {
            grid-area: status-bar;
            font-size: 0.8em;
            color: white;
            text-align: center; /* horizontal */
            align-self: center; /* vertical */
        }

        #messages {
            grid-area: message-area;
            width: 100%;
            height: 8em;
            font-family: var(--monospace), monospace;
            font-size: 0.8em;
            line-height: 1.0;
            padding: 0.5em 1em;
            background: hsl(60 10% 10%);
            color: white;
            overflow-x: hidden;
            overflow-y: scroll;
            scrollbar-color: #999 black;
            .player { color: hsl(120 75% 75%); }
            .entity { color: hsl(30 75% 75%); }
            .other { color: hsl(180 75% 75%); }
            > div {
                margin-left: 1em;
                margin-bottom: 0.25em;
                text-indent: -1em;
            }
        }

        #message-overlay {
            grid-area: message-area;
            height: 0%;
            width: 100%;
            font-family: var(--monospace), monospace;
            font-size: 0.8em;
            line-height: 1.0;
            padding: 0.5em 1em;
            opacity: 0.0;
            pointer-events: none; /* so scroll events go down to the #messages div */
            white-space: pre-wrap;
            background: black;
            color: white;
            transition: all 0.3s;
            &.visible {
                height: 100%;
                opacity: 1.0;
                background: hsl(300 10% 30%);
                transition: all 0s;
            }
        }

        #world-entities {
            max-width: 100%;
            overflow-x: auto;
            font-family: monospace;
            table {
                margin-bottom: 1em;
            }
            th {
                background: #eee;
            }
            td:first-child {
                font-weight: bold;
            }
            td {
                padding: 4px;
            }
            input {
                font-family: monospace;
                border: none;
                border-bottom: 1px dashed black;
                min-width: 4em;
                width: calc-size(min-content + 1em);
                field-sizing: content;
                &:invalid {
                    outline: 2px dashed red;
                }
            }
        }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="game-container">
        <div id="game"></div>
        <div id="health-bar-bg"></div>
        <div id="health-bar-fg"></div>
        <div id="health-bar-text"></div>
        <div id="instructions">
          <div id="look-around">Keyboard/mouse to look around</div>
          <div id="choose-enemy">Choose an enemy to target</div>
          <div id="choose-position">Choose a position to target</div>
          <div id="focus-reminder">Click game for keyboard focus</div>
        </div>
        <div id="messages"></div>
        <div id="message-overlay"></div>
        <div id="inventory-use" class="overlay"></div>
        <div id="inventory-drop" class="overlay"></div>
      </div>
      <div id="world-entities"></div>
    </div>
  </body>
</html>
